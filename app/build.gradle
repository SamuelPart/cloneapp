import java.util.Properties

plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withInputStream { localProperties.load(it) }
}
def tmdbApiKey = localProperties.getProperty('tmdb.api.key', System.getenv('TMDB_API_KEY') ?: '')
def supabaseUrl = localProperties.getProperty('supabase.url', System.getenv('SUPABASE_URL') ?: 'https://cbjnntxiytyaonfrknng.supabase.co')
def supabasePublishableKey = localProperties.getProperty('supabase.publishable.key', System.getenv('SUPABASE_PUBLISHABLE_KEY') ?: 'sb_publishable_jkHz_zJDmldOKfEDLkamWg_9kbod4D9')

android {
    namespace 'com.myiptv.clean'
    compileSdk 36

    defaultConfig {
        applicationId 'com.myiptv.clean'
        minSdk 21
        targetSdk 34
        versionCode 16
        versionName '1.2.13'
        buildConfigField 'String', 'TMDB_API_KEY', '"' + tmdbApiKey + '"'
        buildConfigField 'String', 'SUPABASE_URL', '"' + supabaseUrl + '"'
        buildConfigField 'String', 'SUPABASE_PUBLISHABLE_KEY', '"' + supabasePublishableKey + '"'
    }

    // Keep the existing GitHub updater only in its APK; Play updates through Google Play.
    flavorDimensions += 'distribution'
    productFlavors {
        github {
            dimension 'distribution'
        }
        play {
            dimension 'distribution'
            targetSdk 36
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    buildFeatures {
        viewBinding true
        compose true
        buildConfig true
    }

    composeOptions {
        kotlinCompilerExtensionVersion '1.5.14'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    // Inject the ad-layer guard at document start, including third-party iframe documents.
    implementation 'androidx.webkit:webkit:1.11.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.fragment:fragment-ktx:1.6.2'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'com.google.android.material:material:1.11.0'

    implementation 'androidx.navigation:navigation-fragment-ktx:2.7.7'
    implementation 'androidx.navigation:navigation-ui-ktx:2.7.7'

    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
    implementation 'com.squareup.retrofit2:retrofit:2.9.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.9.0'
    implementation 'com.google.code.gson:gson:2.10.1'

    // Last Google Mobile Ads release compatible with Android 5.0 (API 21).
    // Google deprecated 23.x and plans to sunset it on 2027-06-30; plan its replacement.
    implementation 'com.google.android.gms:play-services-ads:23.6.0'
    // UMP 3.x still supports API 21. Collect privacy choices before initializing ads.
    implementation 'com.google.android.ump:user-messaging-platform:3.2.0'

    // VLC's native engine handles direct channels and videos on phones and Android TV.
    implementation 'org.videolan.android:libvlc-all:3.6.4'

    implementation platform('androidx.compose:compose-bom:2024.06.00')
    implementation 'androidx.activity:activity-compose:1.8.2'
    implementation 'androidx.compose.runtime:runtime'
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.foundation:foundation'
    implementation 'androidx.compose.animation:animation-core'
    implementation 'androidx.compose.ui:ui-graphics'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-extended'
    implementation 'io.coil-kt:coil-compose:2.6.0'
    implementation 'androidx.navigation:navigation-compose:2.7.7'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.8.3'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.8.3'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.8.3'

    debugImplementation 'androidx.compose.ui:ui-tooling'
    debugImplementation 'androidx.compose.ui:ui-test-manifest'

    testImplementation 'junit:junit:4.13.2'
}
